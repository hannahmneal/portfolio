name: Deploy client

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'terraform/**'
      - '.github/workflows/deploy-client.yml'

  # Allow manual re-runs from the Actions tab
  workflow_dispatch:

jobs:
  infra:
    name: Terraform apply
    runs-on: ubuntu-latest

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    defaults:
      run:
        working-directory: terraform

    steps:
      # Checkout repo
      - uses: actions/checkout@v4
      # Set up Terraform
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Build & deploy client
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: List dist contents
        run: find frontend/dist -type f

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      #Client tests
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  audit:
      name: Client dependency audit
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
        # Audit client
        - run: npm audit --audit-level=high
          working-directory: frontend