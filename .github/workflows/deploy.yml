name: Deploy

on:
  push:
    branches: [main]
  # Allow manual re-runs from the Actions tab
  workflow_dispatch:

jobs:
  infra:
    name: Terraform apply
    runs-on: ubuntu-latest

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  frontend:
    name: Build & deploy frontend
    runs-on: ubuntu-latest
    needs: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: List dist contents
        run: find frontend/dist -type f

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREF_API_TOKEN }}

  backend:
    name: Deploy backend
    runs-on: self-hosted   # runs ON your desktop
    needs: infra
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Restart server
        run: pm2 restart server --update-env
        working-directory: backend
  
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend tests
        run: |
          npm ci
          npm test
        working-directory: frontend

      - name: Backend tests
        run: |
          npm ci
          npm test
        working-directory: backend
