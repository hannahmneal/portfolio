name: Deploy

# Frontend deploys are handled by Cloudflare Pages' own GitHub integration
# (see terraform/pages.tf) - it builds and ships frontend/ on every push to
# main with no Action involved. This workflow only tests PRs and ships the
# backend API, which needs a Docker image built, pushed, and a Render
# service redeployed - see "Releasing" in the README.
on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/portfolio-api

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend tests
        run: |
          npm ci
          npm test
        working-directory: frontend

      - name: Backend tests
        run: |
          npm ci
          npm test
        working-directory: backend

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit frontend
        run: npm audit --audit-level=high
        working-directory: frontend
      - name: Audit backend
        run: npm audit --audit-level=high
        working-directory: backend

  build-and-push:
    name: Build & push backend image
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release can target any branch; only ship commits already on main.
      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  terraform-apply:
    name: Terraform apply + redeploy
    needs: build-and-push
    runs-on: ubuntu-latest
    # Two releases published close together must not apply at the same time.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    env:
      # Terraform runs remotely on Terraform Cloud (see the `cloud` block in
      # providers.tf) - this token just authenticates the trigger. All actual
      # variable values (cloudflare_api_token, render_api_key, neon_api_key,
      # image_repository, etc.) live as workspace variables in the Terraform
      # Cloud UI (RedQueenVentures org > portfolio workspace > Variables),
      # not here - setting TF_VAR_* locally would have no effect on a remote
      # run.
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - run: terraform init
      - run: terraform validate
      - run: terraform apply -auto-approve

      # render_web_service is pinned to the "latest" tag on purpose (see the
      # comment in render.tf) - `terraform apply` above only provisions
      # infra, it never tells Render to pull the image build-and-push just
      # pushed. Trigger that redeploy explicitly instead, via the service's
      # deploy hook (Render dashboard > portfolio-api > Settings > Deploy
      # Hook), which sidesteps the buggy Terraform update path entirely.
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
