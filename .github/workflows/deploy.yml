name: Deploy

on:
  push:
    branches:
      - main
  # Allow manual re-runs from the Actions tab
  workflow_dispatch:

jobs:
  infra:
    name: Terraform apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform init
        run: terraform init
        env:
          TF_VAR_cloudflare_api_token:  ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id:    ${{ secrets.CF_ZONE_ID }}
          TF_VAR_domain:                ${{ secrets.DOMAIN }}
          TF_VAR_github_owner:          ${{ secrets.GH_OWNER }}

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_cloudflare_api_token:  ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id:    ${{ secrets.CF_ZONE_ID }}
          TF_VAR_domain:                ${{ secrets.DOMAIN }}
          TF_VAR_github_owner:          ${{ secrets.GH_OWNER }}

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_cloudflare_api_token:  ${{ secrets.CF_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id:    ${{ secrets.CF_ZONE_ID }}
          TF_VAR_domain:                ${{ secrets.DOMAIN }}
          TF_VAR_github_owner:          ${{ secrets.GH_OWNER }}

  # ---------------------------------------------------------------------------
  # Build React app and deploy to Cloudflare Pages via Wrangler
  # ---------------------------------------------------------------------------
  deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    needs: infra  # waits for infra job to succeed

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Expose the API base URL to Vite at build time.
          # In your React code, use: import.meta.env.VITE_API_URL
          VITE_API_URL: https://api.${{ vars.DOMAIN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}